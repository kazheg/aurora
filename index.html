function seedDemoStats(questions) {
  return questions.map((q, i) => {
    const answered = Math.floor(Math.random() * 14) + 2;
    let bias = 0.75;
    if (q.topic === "Cardiovascular Pharmacology" || q.topic === "Autonomic Drugs") bias = 0.55;
    const correct = Math.round(answered * clamp(bias + (Math.random() * 0.2 - 0.1), 0.2, 1));
    const lastAnswered = new Date(Date.now() - Math.random() * 1e3 * 60 * 60 * 24 * 6).toISOString();
    const needsReview = Math.random() < 0.4;
    return {
      ...q,
      stats: {
        timesAnswered: answered,
        timesCorrect: correct,
        lastAnswered,
        nextReview: needsReview ? new Date(Date.now() - Math.random() * 1e3 * 60 * 60 * 24).toISOString() : new Date(Date.now() + (Math.random() * 6 + 1) * 1e3 * 60 * 60 * 24).toISOString(),
        interval: Math.floor(Math.random() * 5) + 1,
        easeFactor: 2.3
      }
    };
  });
}
